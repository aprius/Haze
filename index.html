<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haze</title>
    <!-- The colour mode before the first paint; the bundle takes a moment to load (see src/lib/theme.ts). -->
    <script>
      try {
        if (localStorage.getItem("haze.theme") === "light") document.documentElement.dataset.theme = "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
