[package]
name = "haze"
version = "0.1.0"
description = "Haze - a lightweight AI-first workspace"
edition = "2021"
default-run = "haze"

[lib]
name = "haze_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
encoding_rs = "0.8.42"
fancy-regex = "0.19.2"
globset = "0.4.20"
ignore = "0.4.33"
interprocess = "2.4.6"
log = "0.4.34"
notify = "8.2.0"
nucleo-matcher = "0.3.1"
parking_lot = "0.12.5"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
thiserror = "2.0.21"
trash = "5.2.9"
tree-sitter = "0.27.1"
tree-sitter-c-sharp = "0.23.5"
uuid = { version = "1.28.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
tempfile = "3.27.0"
