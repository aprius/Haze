[package]
name = "haze"
version = "1.0.19"
description = "Haze - a lightweight AI-first workspace"
edition = "2021"
license = "MIT"
default-run = "haze"

[lib]
name = "haze_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
encoding_rs = "0.8.42"
fancy-regex = "0.19.2"
globset = "0.4.20"
ignore = "0.4.33"
interprocess = "2.4.6"
keyring = "4.2.0"
log = "0.4.34"
notify = "8.2.0"
nucleo-matcher = "0.3.1"
parking_lot = "0.12.5"
portable-pty = "0.9.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml_edit = "0.25.17"
trash = "5.2.9"
tree-sitter = "0.27.1"
tree-sitter-c-sharp = "0.23.5"
ureq = { version = "3.4.2", features = ["json", "platform-verifier"] }
uuid = { version = "1.28.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
