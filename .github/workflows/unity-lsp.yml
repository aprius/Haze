name: Unity C# completion

# Roslyn, started the way Haze starts it, must complete Unity types (Rigidbody)
# in a project like the ones Unity generates. Unity's .csproj files are not
# SDK-style, so on Windows Roslyn loads them with Visual Studio's MSBuild, not
# the .NET SDK as on macOS and Linux: run it on all three.
# Test: src-tauri/src/lsp_unity_e2e.rs.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src-tauri/src/lsp.rs
      - src-tauri/src/lsp_unity_e2e.rs
      - .github/workflows/unity-lsp.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  completion:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The Rust crate embeds the built UI.
      - run: npm ci
      - run: npm run build

      - name: Install roslyn-language-server
        run: dotnet tool install --global roslyn-language-server --prerelease

      - name: Visual Studio and MSBuild on the runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -all -prerelease -format text -property displayName,installationVersion,installationPath
          dotnet --info

      - name: Completion test
        working-directory: src-tauri
        run: cargo test --lib lsp_unity_e2e -- --ignored --nocapture

      - name: Upload Roslyn logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roslyn-logs-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            ~/AppData/Local/dev.haze.app/roslyn-logs
            ~/Library/Caches/dev.haze.app/roslyn-logs
            ~/.cache/dev.haze.app/roslyn-logs
