name: Release

# Pushing a `vX.Y.Z` tag (matching the version in tauri.conf.json) builds the
# macOS/Windows/Linux installers, creates the GitHub Release and updates the
# Homebrew cask (Casks/haze.rb). A manual run (workflow_dispatch) only builds and
# leaves the installers under Artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
          # 22.04 so the .deb/.AppImage also run on distros with an older glibc.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $app in tauri.conf.json (run scripts/bump-version.sh)"
            exit 1
          fi

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Optional: sign and notarize the macOS build. Only variables whose secret is
      # set are exported: an empty one (secret not set) still makes Tauri try to
      # sign with an empty certificate. Without secrets the app is signed ad hoc
      # (the Homebrew cask removes the quarantine flag). Tauri signs with the
      # identity read from APPLE_CERTIFICATE itself and only checks that
      # APPLE_SIGNING_IDENTITY is part of that name, so it needs no secret of its own.
      - name: Apple signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<__EOF__"; echo "${!name}"; echo "__EOF__"; } >> "$GITHUB_ENV"
            fi
          done
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Haze ${{ github.ref_name }}
          releaseBody: |
            **macOS (Homebrew)**
            ```
            brew tap aprius/haze https://github.com/aprius/Haze
            brew install --cask haze
            ```
            Or download an installer below: `.dmg` (macOS, Intel + Apple Silicon), `-setup.exe` / `.msi` (Windows), `.deb` / `.rpm` / `.AppImage` (Linux).
          releaseDraft: false
          prerelease: false

      # Update Now on Windows replaces haze.exe in place (src-tauri/src/updates.rs),
      # so the release also carries the bare executable.
      - name: Publish haze.exe
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe="$RUNNER_TEMP/Haze_${GITHUB_REF_NAME#v}_x64.exe"
          cp src-tauri/target/release/haze.exe "$exe"
          gh release upload "$GITHUB_REF_NAME" "$exe" --clobber

      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: haze-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  homebrew:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A slow run for an older tag must not downgrade a cask that a newer
          # release has already updated.
          current=$(sed -n -E 's/^  version "(.*)"/\1/p' Casks/haze.rb)
          if [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)" != "$version" ]; then
            echo "Cask is at $current, newer than $version; skipping"
            exit 0
          fi
          dmg="Haze_${version}_universal.dmg"
          gh release download "$GITHUB_REF_NAME" --pattern "$dmg" --dir "$RUNNER_TEMP"
          sha=$(sha256sum "$RUNNER_TEMP/$dmg" | cut -d' ' -f1)
          sed -i -E \
            -e "s/^  version \".*\"/  version \"$version\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" \
            Casks/haze.rb
          # The `haze` command ships inside Haze.app from 1.0.5 on, so the cask
          # links it only once it points at such a release.
          grep -q '^  binary ' Casks/haze.rb ||
            sed -i -E 's|^  app "Haze.app"$|&\n  binary "#{appdir}/Haze.app/Contents/Resources/haze"|' Casks/haze.rb
          if git diff --quiet; then
            echo "Cask is already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Homebrew: haze $version"
          git push
